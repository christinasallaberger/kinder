<style>
:root{--paper:#F3F4EE;--surface:#FFFFFF;--clip:#FBFBF6;--ink:#1F2A23;--soft:#5B6A5F;--line:#D8DED2;--marker:#D4EC8E;--accent:#2E6B3C;--accent-ink:#FFFFFF;--chip:#EAF0E1;--ok:#1E7A45;--ok-bg:#E3F5EA;--warn:#8A5A00;--warn-bg:#FFF3D6;--bad:#B8213A;--bad-bg:#FCE6E9;color-scheme:light}

mark.rp{color:#1F2A23;border-radius:3px;padding:0 2px}

.score{font-family:"Newsreader",Georgia,serif;font-size:60px;font-weight:800;line-height:1}

.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:15px}td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.facts td:first-child{font-weight:700;white-space:nowrap;padding-right:10px}

.note{font-size:14px;color:var(--soft)}
.hidden{display:none!important}

.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}

.opt.right{border-color:var(--ok);background:var(--ok-bg)}.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.phr h4{margin:10px 0 4px;font-size:15px}.phr ul{margin:0;padding-left:18px}.phr li{margin:2px 0}
.rules{margin:6px 0;padding-left:20px}.rules li{margin:3px 0}
.aist{font-size:14px;color:var(--soft);margin-top:8px}.aist:empty{display:none}
.modal{position:fixed;inset:0;background:rgba(10,20,12,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.mbox{background:var(--surface);color:var(--ink);border-radius:14px;padding:18px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.mbox p{margin:0 0 14px}
details>summary{cursor:pointer}
@media (max-width:480px){.bars{grid-template-columns:96px 1fr 46px}.clip{padding:14px}}

<script>
/* ===================== HILFSFUNKTIONEN ===================== */
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const LT='a-zäöüßA-ZÄÖÜ';
function wre(p,fl='i'){return new RegExp('(?<!['+LT+'])'+reEsc(p).replace(/\s+/g,'\\s+')+'(?!['+LT+'])',fl);}
const words=t=>(String(t||'').match(/[A-Za-zÄÖÜäöüß0-9]+(?:[-’'][A-Za-zÄÖÜäöüß0-9]+)*/g)||[]);
const wc=t=>words(t).length;
const W=[120,150];

/* ===================== AUFGABEN ===================== */
/* type 'notizen' = Bericht mit freier Hand (Reporter-Notizen oder umgangssprachliche Zeugenaussage)
   type 'angaben' = Bericht mit vielen Angaben (Eckdaten + Aussagen der handelnden Personen) */
const TASKS=[
{id:'paragleiter',type:'notizen',title:'Paragleiter in Baumkrone',de:'Reporter-Notizen',ort:'Gmunden',
 notes:'Paragleiter – Landung in Baumkrone – Grünberg bei Gmunden – Sonntag, 6. Juli, 15.30 Uhr – Pilot Stefan H. (44) aus Wels – Windböe kurz nach dem Start – Schirm verfängt sich in 25 Meter hoher Fichte – Spaziergänger alarmieren Einsatzkräfte – Drehleiter der Feuerwehr zu kurz – zwei Bergretter klettern hinauf, seilen ihn ab – nach zwei Stunden am Boden – leichte Prellungen – Schirm stark beschädigt',
 keys:[{f:'Wer?',h:'Stefan H. (44)',w:['Stefan','44-J','Pilot','Paragleiter']},{f:'Wo?',h:'Grünberg bei Gmunden',w:['Grünberg','Gmunden']},{f:'Wann?',h:'6. Juli, 15.30 Uhr',w:['6. Juli','Sonntag','15.30','15:30']},{f:'Wie?',h:'Windböe, Fichte',w:['Böe','Wind','Fichte']},{f:'Hilfe?',h:'Bergretter seilen ab',w:['abgeseilt','seilten','Bergrett']},{f:'Folgen?',h:'leichte Prellungen, Schirm beschädigt',w:['Prellung','beschädigt','kaputt']}],
 model:{headline:'Paragleiter landet in Baumkrone',summary:'Ein Paragleiter verfing sich am Sonntag am Grünberg bei Gmunden in einer Fichte. Er hing zwei Stunden in rund 25 Metern Höhe fest.',hauptteil:'Gmunden. Am 6. Juli startete Stefan H. (44) aus Wels gegen 15.30 Uhr zu einem Flug vom Grünberg. Kurz nach dem Start erfasste eine Windböe seinen Schirm und drückte ihn gegen den Waldrand. Dabei verfing sich der Pilot in der Krone einer 25 Meter hohen Fichte. Spaziergänger beobachteten den Vorfall und alarmierten die Einsatzkräfte. Da die Drehleiter der Feuerwehr nicht ausreichte, kletterten zwei Bergretter auf den Baum und seilten den Mann ab.',schluss:'Nach rund zwei Stunden hatte der 44-Jährige wieder festen Boden unter den Füßen. Er erlitt nur leichte Prellungen, sein Schirm wurde jedoch stark beschädigt.'}},
{id:'unterfuehrung',type:'notizen',title:'Wasserrohrbruch in Unterführung',de:'Reporter-Notizen',ort:'Salzburg',
 notes:'Wasserrohrbruch – Hauptleitung geplatzt – Unterführung in der Ignaz-Harrer-Straße, Salzburg – Mittwoch, 12. März, 6.15 Uhr – Frühverkehr – Wasser bis zu 1 Meter hoch – 2 Autos stecken fest – Lenker klettern aufs Autodach – Feuerwehr holt sie mit Boot – Pumpen – niemand verletzt – Unterführung bis Abend gesperrt – Tausende Haushalte ohne Wasser – Stadtwerke tauschen Rohr',
 keys:[{f:'Wer?',h:'zwei Autolenker',w:['Lenker','Autofahrer','zwei Autos']},{f:'Wo?',h:'Ignaz-Harrer-Straße, Salzburg',w:['Ignaz-Harrer','Salzburg','Unterführung']},{f:'Wann?',h:'12. März, 6.15 Uhr',w:['12. März','Mittwoch','6.15','6:15']},{f:'Was?',h:'Wasserrohrbruch',w:['Rohr','Leitung']},{f:'Wie?',h:'aufs Autodach, Boot',w:['Dach','Boot']},{f:'Folgen?',h:'gesperrt, Haushalte ohne Wasser',w:['gesperrt','Haushalte','niemand']}],
 model:{headline:'Wasserrohrbruch setzt Unterführung unter Wasser',summary:'Nach einem Wasserrohrbruch stand am Mittwoch eine Unterführung in Salzburg meterhoch unter Wasser. Zwei Autofahrer mussten gerettet werden.',hauptteil:'Salzburg. Am 12. März platzte gegen 6.15 Uhr eine Hauptwasserleitung in der Ignaz-Harrer-Straße. Innerhalb weniger Minuten stieg das Wasser in der Unterführung auf bis zu einen Meter an. Zwei Autos, die gerade durchfuhren, blieben stecken. Die Lenker kletterten auf die Dächer ihrer Fahrzeuge und riefen um Hilfe. Die Feuerwehr brachte sie mit einem Boot in Sicherheit und pumpte anschließend die Fluten ab. Der Frühverkehr kam dadurch völlig zum Erliegen.',schluss:'Verletzt wurde niemand. Die Unterführung blieb bis zum Abend gesperrt, Tausende Haushalte waren stundenlang ohne Wasser. Die Stadtwerke tauschten das kaputte Rohr noch am selben Tag aus. Die Ursache des Schadens war vermutlich das hohe Alter der Leitung.'}},
{id:'lkwbruecke',type:'notizen',title:'Lkw unter Bahnbrücke',de:'Reporter-Notizen',ort:'Villach',
 notes:'Lkw steckt unter Bahnbrücke fest – Draupromenade, Villach – Montag, 17. Februar, 10.40 Uhr – Lenker Milan P. (39) aus Slowenien – folgt dem Navi – übersieht Schild: Durchfahrtshöhe 3,20 Meter – Lkw 3,80 Meter hoch – Aufbau aufgerissen – Zugverkehr 2 Stunden gestoppt, Brücke wird geprüft – Abschleppwagen – niemand verletzt – Lenker angezeigt',
 keys:[{f:'Wer?',h:'Milan P. (39)',w:['Milan','39-J','Lenker']},{f:'Wo?',h:'Draupromenade, Villach',w:['Draupromenade','Villach']},{f:'Wann?',h:'17. Februar, 10.40 Uhr',w:['17. Februar','Montag','10.40','10:40']},{f:'Wie?',h:'Navi, Schild übersehen, zu hoch',w:['Navi','Schild','3,20','3,80']},{f:'Folgen?',h:'Zugverkehr gestoppt, angezeigt',w:['Zug','angezeigt','Abschlepp']}],
 model:{headline:'Lkw bleibt unter Bahnbrücke stecken',summary:'In Villach blieb am Montag ein Lkw unter einer zu niedrigen Bahnbrücke stecken. Der Zugverkehr wurde für zwei Stunden eingestellt.',hauptteil:'Villach. Am 17. Februar war Milan P. (39) aus Slowenien gegen 10.40 Uhr mit seinem Lkw auf der Draupromenade unterwegs. Er folgte seinem Navigationsgerät und übersah dabei das Schild, das eine Durchfahrtshöhe von 3,20 Metern anzeigte. Sein Fahrzeug war jedoch 3,80 Meter hoch. Der Aufbau prallte gegen die Brücke und wurde aufgerissen. Bis Experten die Bahnbrücke überprüft hatten, durften keine Züge darüberfahren.',schluss:'Verletzt wurde niemand. Ein Abschleppwagen zog den Lkw nach rund zwei Stunden aus der Engstelle. Die Bahnstrecke war anschließend wieder frei befahrbar. Der Lenker wurde angezeigt. Für die Schäden an der Brücke muss nun seine Versicherung aufkommen.'}},
{id:'lichtschacht',type:'notizen',title:'Dackel im Lichtschacht',de:'Reporter-Notizen',ort:'St. Pölten',
 notes:'Tierrettung – Dackel Bruno – Wohnsiedlung Wagram, St. Pölten – Samstag, 22. November, 9 Uhr – Besitzerin Helga R. (71) beim Spaziergang – verrostetes Gitter gibt nach – Hund stürzt 3 Meter tief in Lichtschacht – Besitzerin hört Bellen – Feuerwehr mit Leiter – Feuerwehrmann trägt Hund hinauf – unverletzt, aber schmutzig – Hausverwaltung tauscht Gitter',
 keys:[{f:'Wer?',h:'Dackel Bruno, Helga R. (71)',w:['Bruno','Dackel','Helga']},{f:'Wo?',h:'Wagram, St. Pölten',w:['Wagram','St. Pölten']},{f:'Wann?',h:'22. November, 9 Uhr',w:['22. November','Samstag','9 Uhr']},{f:'Wie?',h:'Gitter gibt nach',w:['Gitter','Lichtschacht']},{f:'Hilfe?',h:'Feuerwehr mit Leiter',w:['Leiter','Feuerwehr']},{f:'Folgen?',h:'unverletzt, schmutzig',w:['unverletzt','schmutzig','verschmutzt']}],
 model:{headline:'Feuerwehr rettet Dackel aus Lichtschacht',summary:'In St. Pölten fiel am Samstag ein Dackel in einen drei Meter tiefen Lichtschacht. Die Feuerwehr holte das Tier unverletzt heraus.',hauptteil:'St. Pölten. Am 22. November ging Helga R. (71) gegen 9 Uhr mit ihrem Dackel Bruno in der Wohnsiedlung Wagram spazieren. Plötzlich gab ein verrostetes Gitter unter dem Hund nach, und er stürzte drei Meter tief in einen Lichtschacht. Die Pensionistin hörte ihn bellen, konnte ihn aber nicht selbst befreien. Sie verständigte deshalb die Feuerwehr. Ein Feuerwehrmann stieg mit einer Leiter hinunter und trug den Vierbeiner nach oben. Zur Sicherheit ließ die Besitzerin ihn anschließend vom Tierarzt untersuchen.',schluss:'Bruno blieb unverletzt, war aber völlig verschmutzt. Die Hausverwaltung will die alten Gitter nun rasch austauschen lassen. Laut den Einsatzkräften kommen solche Einsätze öfter vor, als man denkt.'}},
{id:'sturm',type:'notizen',title:'Sturm deckt Schuldach ab',de:'Reporter-Notizen',ort:'Feldkirchen in Kärnten',
 notes:'Sturm – Böen bis 120 km/h – Feldkirchen in Kärnten – Donnerstag, 30. Oktober, 13 Uhr, während des Unterrichts – Blechverkleidung vom Dach der Mittelschule gerissen – Teile auf Schulhof und Parkplatz – 3 Autos beschädigt – Direktorin Andrea M. (52) – 280 Schüler bleiben in Klassen – Feuerwehr deckt Dach mit Planen ab – Freitag kein Unterricht – niemand verletzt',
 keys:[{f:'Wer?',h:'Mittelschule, Direktorin Andrea M. (52), 280 Schüler',w:['Mittelschule','Andrea','Direktorin','280']},{f:'Wo?',h:'Feldkirchen in Kärnten',w:['Feldkirchen']},{f:'Wann?',h:'30. Oktober, 13 Uhr',w:['30. Oktober','Donnerstag','13 Uhr']},{f:'Was?',h:'Sturm reißt Dachteile weg',w:['Sturm','Dach']},{f:'Wie?',h:'Böen bis 120 km/h, Planen',w:['120','Planen']},{f:'Folgen?',h:'3 Autos beschädigt, kein Unterricht',w:['beschädigt','Unterricht']}],
 model:{headline:'Sturm deckt Schuldach ab',summary:'Ein heftiger Sturm riss am Donnerstag in Feldkirchen in Kärnten einen Teil des Daches einer Mittelschule weg. Verletzt wurde niemand.',hauptteil:'Feldkirchen in Kärnten. Am 30. Oktober fegten gegen 13 Uhr Sturmböen mit bis zu 120 km/h über den Ort. Während des Unterrichts löste sich ein Teil der Blechverkleidung vom Dach der Mittelschule. Die Teile landeten auf dem Schulhof und auf dem angrenzenden Parkplatz, wo sie drei Autos beschädigten. Direktorin Andrea M. (52) ließ alle 280 Schülerinnen und Schüler in ihren Klassen bleiben. Die Feuerwehr deckte das Gebäude anschließend mit Planen ab.',schluss:'Am Freitag fand kein Unterricht statt, da das Dach erst repariert werden muss. Die beschädigten Autos wurden abgeschleppt. Die Höhe des Schadens ist noch nicht bekannt. Laut der Direktorin soll der Unterricht am Montag wieder normal beginnen.'}},
{id:'kajak',type:'notizen',title:'Kajakfahrer kentert',de:'Reporter-Notizen',ort:'Großraming',

 keys:[{f:'Wer?',h:'Tobias K. (27)',w:['Tobias','27-J','Kajakfahrer']},{f:'Wo?',h:'Enns bei Großraming',w:['Enns','Großraming']},{f:'Wann?',h:'14. Juni, 11 Uhr',w:['14. Juni','Samstag','11 Uhr']},{f:'Wie?',h:'Stromschnelle, gekentert',w:['Stromschnelle','kenterte','gekentert']},{f:'Hilfe?',h:'Wasserrettung mit Boot',w:['Wasserrettung','Boot']},{f:'Folgen?',h:'unterkühlt, Kajak verloren',w:['unterkühlt','verloren','gefunden']}],
 model:{headline:'Kajakfahrer aus der Enns gerettet',summary:'Auf der Enns bei Großraming kenterte am Samstag ein Kajakfahrer. Die Wasserrettung zog den 27-Jährigen aus dem Fluss.',hauptteil:'Großraming. Am 14. Juni war Tobias K. (27) aus Steyr gegen 11 Uhr mit einem Freund im Kajak auf der Enns unterwegs. Bei einer Stromschnelle kenterte sein Boot. Der junge Mann trug zwar eine Schwimmweste, wurde aber rund 500 Meter flussabwärts getrieben. Sein Begleiter wählte sofort den Notruf. Kurz darauf traf die Wasserrettung mit einem Motorboot ein und holte den Verunglückten aus dem eiskalten Wasser.',schluss:'Der 27-Jährige war leicht unterkühlt, ansonsten aber unverletzt. Sein Kajak konnte nicht mehr gefunden werden. Die Wasserrettung warnt, dass die Enns nach den starken Regenfällen viel Wasser führt. Wer paddeln möchte, sollte vorher unbedingt den aktuellen Pegelstand prüfen.'}},

 model:{headline:'Gasleck: Volksschule geräumt',summary:'Bei Bauarbeiten in Leoben beschädigte am Dienstag ein Bagger eine Gasleitung. Eine nahe Volksschule musste geräumt werden.',hauptteil:'Leoben. Am 9. September stieß Baggerfahrer Peter G. (33) gegen 9.30 Uhr in der Franz-Josef-Straße bei Grabungsarbeiten auf eine Gasleitung und beschädigte sie. Sofort strömte Gas aus, und in der Umgebung war ein starker Geruch zu bemerken. Die Feuerwehr sperrte die Straße ab. Als Vorsichtsmaßnahme brachten Lehrerinnen und Einsatzkräfte die 190 Kinder der nahen Volksschule in die Turnhalle einer anderen Schule. Mitarbeiter des Gaswerks dichteten das Leck schließlich ab.',schluss:'Nach rund drei Stunden gab die Feuerwehr Entwarnung, und die Kinder durften in ihre Klassen zurückkehren. Verletzt wurde niemand. Die Baufirma muss nun für den Schaden aufkommen. Die Arbeiten auf der Baustelle ruhen vorerst.'}},

 model:{headline:'Handtaschenraub am Grazer Hauptbahnhof',summary:'Am Grazer Hauptbahnhof riss ein Unbekannter am 19. Jänner einer älteren Frau die Handtasche weg. Die Frau wurde dabei verletzt.',hauptteil:'Graz. Gegen 16.30 Uhr wartete eine ältere Dame auf dem Bahnsteig 3 auf ihren Zug. Plötzlich näherte sich ein Mann mit Kapuze und entriss ihr die Handtasche. Die Frau stürzte zu Boden. Laut dem Augenzeugen Elias B. (16) flüchtete der Täter anschließend in Richtung Annenstraße. Ein Kioskmitarbeiter nahm die Verfolgung auf, konnte den Räuber aber nicht einholen. Der Schüler kümmerte sich inzwischen um die Verletzte. In der Tasche befanden sich ein Handy und rund 300 Euro.',schluss:'Die Rettung brachte die Pensionistin mit einer Armverletzung ins Krankenhaus. Die Polizei wertet nun die Aufnahmen der Überwachungskameras aus und bittet um Hinweise.'}},

 model:{headline:'Einbrecher plündern Uhrengeschäft in Steyr',summary:'Zwei Unbekannte brachen am 2. Februar in ein Uhrengeschäft in Steyr ein. Sie erbeuteten Uhren im Wert von mindestens 50.000 Euro.',hauptteil:'Steyr. Gegen 3 Uhr früh wurde eine Anrainerin durch lautes Klirren geweckt. Wie Renate H. (59) berichtete, schlugen zwei junge Männer gerade die Auslagenscheibe des Geschäfts gegenüber ein. Innerhalb kürzester Zeit packten die Täter zahlreiche Uhren in ihre Taschen. Anschließend flüchteten sie mit einem dunklen Auto. Die 59-Jährige alarmierte sofort die Polizei, die nur fünf Minuten später eintraf.',schluss:'Von den Einbrechern fehlt jedoch jede Spur. Laut dem Besitzer beträgt der Schaden mindestens 50.000 Euro. Er will die Auslage künftig mit einem Gitter sichern. Die Polizei bittet Zeugen, die in der Nacht ein dunkles Fahrzeug sahen, sich zu melden.'}},

 model:{headline:'Radfahrer angefahren – Lenker flüchtet',summary:'In Krems an der Donau wurde am 27. Mai ein Radfahrer von einem Auto erfasst und verletzt. Der Lenker beging Fahrerflucht.',hauptteil:'Krems an der Donau. Gegen 19 Uhr bog ein silberner PKW bei der Ampel an der Ringstraße aus einer Seitengasse und erfasste einen Radfahrer. Der Mann wurde über die Motorhaube geschleudert und blieb auf der Fahrbahn liegen. Laut dem Augenzeugen Kevin L. (22) setzte der Autofahrer seine Fahrt fort, ohne zu bremsen. Der Zeuge merkte sich einen Teil des Kennzeichens: Es begann mit KR und enthielt die Zahl 47. Andere Passanten leisteten Erste Hilfe.',schluss:'Der Radfahrer erlitt eine Kopfverletzung und wurde von der Rettung ins Krankenhaus gebracht. Die Polizei sucht nun nach dem silbernen Fahrzeug und bittet um Hinweise. Fahrerflucht ist in Österreich eine Straftat.'}},

Regeln für den Zeitungsbericht: Präteritum (nur der aktuelle Stand darf im Präsens stehen), sachlich ohne Wertungen und Gefühle, Aussagen dürfen als direkte Rede (richtig gesetzt: Doppelpunkt, „…“, Komma nach dem Schlusszeichen, Ich-Form und Umgangssprache nur innerhalb der Anführungszeichen) oder als indirekte Rede mit Konjunktiv (sei, habe) eingebaut werden, keine Ich-Form, Nachnamen abgekürzt mit Alter (Sandra W. (29)), Summary beginnt mit Ortsmarke („Wels.“), Headline ohne Punkt.`;
function stepPrompt(t,label,txt){return `${BASE}
Prüfe diesen Teil eines Zeitungsberichts (Teil: ${label}). Thema: ${t.title}.
Text:
"""${txt}"""
Finde echte Fehler: Rechtschreibung, Grammatik (Fälle, Endungen, Verbformen), Satzbau, Zeichensetzung (vor allem Kommas), Groß- und Kleinschreibung, falsche Zeitform und Verstöße gegen die Bericht-Regeln.
Antworte NUR mit JSON, ohne Markdown:
{"fehler":[{"original":"wörtlich aus dem Text kopierter, möglichst kurzer Ausschnitt (1–6 Wörter, bei fehlendem Komma das Wort davor und danach)","korrektur":"richtige Form","art":"${ART}","erklaerung":"ein kurzer, kindgerechter Satz auf Deutsch"}]}
Höchstens 8 Fehler, die wichtigsten zuerst. Erfinde keine Fehler. Wenn alles stimmt: {"fehler":[]}`;}
function normErrs(a){return (Array.isArray(a)?a:[]).filter(e=>e&&e.original&&e.korrektur&&String(e.original).trim()!==String(e.korrektur).trim()).slice(0,10).map(e=>({original:String(e.original),korrektur:String(e.korrektur),art:String(e.art||''),erklaerung:String(e.erklaerung||'')}));}
async function aiCheck(t,label,txt){const sample=await getSample();if(!sample||aiOff)throw {code:'none'};try{const r=await sample.json(stepPrompt(t,label,txt),{modelTier:'quick'});return normErrs(r&&r.fehler);}catch(e){if(e&&e.code==='not_granted')aiOff=true;throw e;}}
function aiErrMsg(e){return e&&e.code==='rate_limited'?'Gerade zu viele Anfragen – bitte in einer Minute noch einmal.':e&&e.code==='not_granted'?'Die Claude-Prüfung ist hier nicht erlaubt. Die Sofort-Kontrolle läuft weiter.':e&&e.code==='none'?'':'Die Claude-Prüfung hat nicht geklappt. Bitte noch einmal versuchen.';}

 if(t.type==='notizen'&&!t.wit)inner=`<p class="note" style="margin:0 0 4px">Aus den Notizen eines Reporters:</p><p style="margin:0">${esc(t.notes)}</p><p class="note">Hier hast du „freie Hand“: Mach aus den Stichwörtern ganze Sätze und einen zusammenhängenden Bericht. Erfinde nichts Wichtiges dazu.</p>`;
 else if(t.type==='notizen')inner=`<p class="note" style="margin:0 0 4px"><b>${esc(t.src)}</b></p>${t.wit.map(w=>`<div class="wit">${esc(w.text)}</div>`).join('')}<p class="note">Achtung: Der Zeuge spricht Umgangssprache. Schreib sachlich in Standardsprache, ohne Wertungen. Zitierst du ihn wörtlich, wähle einen passenden Satz und setze die Anführungszeichen richtig.</p>`;
 else inner=`<p style="margin:0 0 8px">${esc(t.info)}</p><p class="note" style="margin:0"><b>Die handelnden Personen:</b></p>${t.wit.map(w=>`<div class="wit"><b>${esc(w.who)}</b>${esc(w.text)}</div>`).join('')}<p class="note">Beantworte die W-Fragen mit diesen Angaben. Die Aussagen baust du als <b>direkte Rede</b> (<i>„…“, sagte Polizist Gerhard T.</i>) oder <b>indirekte Rede</b> (<i>Laut Polizist Gerhard T. sei …</i>) ein.</p>`;

function phraseCard(){const on=S.cur?S.cur.help:S.help;return on?`<div class="card phr"><div class="row" style="justify-content:space-between"><h3>Wichtige Formulierungen</h3><button class="btn s sm" id="phT">Formulierungen ausblenden</button></div><p class="note" style="margin:0">Lies sie dir durch, bevor du schreibst. Wenn du sicher bist, blende sie aus – bei der Schularbeit hast du sie auch nicht.</p>${PHRASES.map(([h,l])=>`<h4>${esc(h)}</h4><ul>${l.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`).join('')}</div>`:`<div class="card row" style="justify-content:space-between"><span class="note">Formulierungen sind ausgeblendet.</span><button class="btn s sm" id="phT">Formulierungen einblenden</button></div>`;}

function merkbox(){return `<details class="card"><summary><b>Merkbox: So schreibst du einen Zeitungsbericht</b></summary><div class="merk" style="margin-top:10px">

<p><b>1. Headline</b> im Telegrammstil – ohne Artikel, ohne „ist / wurde“, ohne Punkt: <i>Mopedlenker bei Sturz verletzt</i> (nicht: <i>Ein Mopedlenker ist bei einem Sturz verletzt worden</i>).<br><b>2. Summary</b> – 1 bis 2 Sätze, fasst den Bericht zusammen.<br><b>3. Hauptteil</b> – beginnt mit der Ortsmarke (<i>Linz.</i>), beantwortet die W-Fragen: Was? Wo? Wann? Wer? Wie?<br><b>4. Schluss</b> – Welche Folgen?</p>

<p><b>Beispiel:</b></p>${clipHTML('Feuerwehr rettet Hund aus der Donau','In Linz zog die Feuerwehr am Sonntag einen Hund aus der Donau. Das Tier blieb unverletzt.',['Linz. Am 6. April sprang der Labrador Bello gegen 16 Uhr beim Spielen ins Wasser und wurde von der Strömung abgetrieben. Seine Besitzerin Eva K. (45) verständigte sofort die Einsatzkräfte. Wenig später zogen die Feuerwehrleute das erschöpfte Tier mit einem Boot ans Ufer.','Laut Feuerwehr sei der Hund unverletzt geblieben. Seine Besitzerin muss nun besser auf ihn aufpassen.'],[],[],false)}
<p class="note" style="margin-top:10px"><b>Schreib die Merkbox mit dem Beispiel ins Heft ab.</b></p></div></details>`;}
function keys(){return `<div class="keys" aria-label="Eingabehilfe">${['„','“','ä','ö','ü','ß','Ä','Ö','Ü',',','.','-','–','(',')',':','?','!'].map(k=>`<button class="chip" data-k="${k}">${k}</button>`).join('')}<button class="chip" data-k="\n">↵</button></div>`;}
function insertAt(f,txt){if(f.tagName==='INPUT'&&txt==='\n')return;const s=f.selectionStart??f.value.length,e=f.selectionEnd??f.value.length;f.value=f.value.slice(0,s)+txt+f.value.slice(e);const p=s+txt.length;f.focus();f.setSelectionRange(p,p);f.dispatchEvent(new Event('input'));}
let lastField=null;function bindKeys(){app.querySelectorAll('textarea:not([readonly]),input[type=text]').forEach(f=>f.addEventListener('focus',()=>lastField=f));app.querySelectorAll('.keys .chip').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>{const f=lastField&&document.body.contains(lastField)?lastField:app.querySelector('#ta');if(f)insertAt(f,b.dataset.k);};});}

 return top.length?`<div class="card" style="border-color:var(--warn)"><h3>Dein Fokus für diese Runde</h3>${top.map(([k,v])=>`<div class="f warn" style="margin:6px 0"><b>${esc(k)}</b> (${v}× in den letzten Runden): ${TIP[k]||''}</div>`).join('')}</div>`:'';}

 ${S.cur?`<div class="card" style="border-color:var(--accent)"><h3>Angefangene Runde</h3><p class="note">${S.cur.tasks.map(id=>esc(T(id)?T(id).title:id)).join(' + ')}</p><div class="row"><button class="btn" id="cont">Weiterschreiben</button><button class="btn s sm" id="drop">Verwerfen</button></div></div>`:''}

 ${S.hist.length?`<div class="card"><h3>Dein Fortschritt</h3><p class="note">${S.hist.length} Runde${S.hist.length>1?'n':''} · Bestwert ${Math.max(...S.hist.map(h=>h.s))} Punkte</p>${chart()}<div class="tablewrap"><table><tr><th>Datum</th><th>Berichte (antippen zum Lesen)</th><th>Stufe</th><th>Regeln</th><th>Ø</th></tr>${S.hist.map((h,i)=>[h,i]).reverse().map(([h,i])=>`<tr><td>${new Date(h.d*864e5).toLocaleDateString('de-AT')}</td><td>${(h.r||[]).map((r,j)=>`<button class="btn s sm old" data-i="${i}" data-j="${j}" style="margin:2px 0">${esc((T(r.t)||{}).title||r.t)}: ${r.s}</button>`).join('<br>')}</td><td>${h.l}${h.hp===0?'<br><small>ohne Hilfe</small>':''}</td><td>${h.q?h.q[0]+'/'+h.q[1]:'–'}${h.ir?`<br><small>Reden ${h.ir[0]}/${h.ir[1]}</small>`:''}</td><td><b>${h.s}</b></td></tr>`).join('')}</table></div></div>`:''}

function pickQuiz(){const wrong=(S.qw||[]).filter(i=>QUIZ[i]).slice(0,2);const rest=QUIZ.map((_,i)=>i).filter(i=>!wrong.includes(i)).sort(()=>Math.random()-.5);return [...wrong,...rest].slice(0,4).sort(()=>Math.random()-.5);}

const IRNORM=t=>String(t||'').toLowerCase().replace(/[„“”"‚‘’'.,!?:;–\-()]/g,' ').replace(/\s+/g,' ').trim();

const SPEAKER=/^(polizist|polizistin|zeugin|zeuge|notarzt|notärztin|lenkerin|lenker|bauer|bäuerin|kommandant|feuerwehrkommandant|wanderer|feuerwehrmann|landwirtin|busfahrer|einsatzleiter|tierarzt|autolenkerin)$/i;
const nounsOf=t=>words(t).filter(w=>(/^[A-ZÄÖÜ]/.test(w)&&!FUNCW.has(w.toLowerCase())&&!SPEAKER.test(w))||/^\d/.test(w));
const hasWord=(a,w)=>wre(w,'i').test(a)||(w.length>5&&a.toLowerCase().includes(w.toLowerCase().slice(0,w.length-2)));

function irCheck(it,ans){const L=[];const add=(ok,txt)=>L.push({ok,txt});const a=ans.trim();const low=a.toLowerCase();const body=low.replace(/^[^,]*,/,'');
 const q=/[„“"«»]/.test(a);add(!q,q?'In der indirekten Rede stehen <b>keine Anführungszeichen</b>.':'Keine Anführungszeichen');
 const intro=IRVERB.test(IRNORM(a));add(intro,intro?'Einleitung mit einem Verb des Sagens (bzw. „laut“)':'Es fehlt die Einleitung: <i>… sagte, …</i> / <i>… gab an, …</i> / <i>Laut … sei …</i>');
 if(intro&&!/(?<![a-zäöüß])(laut|zufolge)(?![a-zäöüß])/i.test(a)){const m=a.match(/(?<![a-zäöüß])(sagte|erklärte|berichtete|meinte|betonte|erzählte|schilderte|bestätigte|versicherte|gab\s+an|teilte\s+mit)\s+[a-zäöüß]/i);add(!m,m?`Nach „${esc(m[1])}“ steht ein <b>Komma</b>: <i>… ${esc(m[1])}, sie …</i>`:'Komma nach dem Einleitungsverb');}
 if(hasW(it.d,PRON1,'i').length){const left=hasW(a.replace(/^[^,]*,/,''),PRON1,'i');add(!left.length,left.length?`„<b>${esc(left[0])}</b>“ musst du umwandeln: ich → er/sie, wir → sie, mir → ihm/ihr, mein → sein/ihr.`:'Pronomen angepasst (ich/wir → er/sie)');}
 const ind=INDIK.exec(body);const k=KONJ.test(body);
 if(ind)add(false,`„<b>${ind[1]}</b>“ ist die Wirklichkeitsform. In der indirekten Rede brauchst du den Konjunktiv: <i>sei, seien, habe, hätten …</i>`);
 else if(!k)add(false,/(?<![a-zäöüß])haben(?![a-zäöüß])/.test(body)?'„haben“ klingt gleich wie die Wirklichkeitsform – nimm <b>hätten</b>.':'Das Verb muss in den Konjunktiv: <i>sei, seien, habe, hätten, könne …</i>');
 else add(true,'Verb im Konjunktiv');
 const miss=nounsOf(it.d).filter(w=>!hasWord(a,w));add(!miss.length,miss.length?'Vom Inhalt fehlt noch: <b>'+miss.map(esc).join(', ')+'</b>':'Inhalt vollständig');
 return {ok:L.every(x=>x.ok),list:L};}
function drCheck(it,ans){const L=[];const add=(ok,txt)=>L.push({ok,txt});const t=ans.trim().replace(/"([^"]*)"/,'„$1“');
 const m=t.match(/^(.*?)[„«“]([^„“”«»]+)[“”»](.*)$/);
 if(!m){add(false,'Bei der direkten Rede brauchst du <b>Anführungszeichen</b>: unten am Anfang „ und oben am Ende “ (auf der Eingabehilfe).');return {ok:false,list:L};}
 add(true,'Anführungszeichen');
 const pre=m[1].trim(),inner=m[2].trim(),post=m[3].trim();const zs=[];
 if(!pre&&!post)zs.push('Es fehlt der Begleitsatz – wer sagt das? (<i>„…“, sagte die Zeugin.</i>)');
 if(pre){if(!/:$/.test(pre))zs.push('Steht der Begleitsatz vorne, kommt vor die Rede ein <b>Doppelpunkt</b>.');if(!SAIDV.test(pre))zs.push('Im Begleitsatz fehlt ein Verb des Sagens (sagte, erklärte, fragte …).');if(!/[.!?]$/.test(inner))zs.push('Begleitsatz vorne → die Rede endet mit Punkt (oder ? / !) <b>vor</b> dem Schlusszeichen.');}
 else if(post){if(!/^,/.test(post))zs.push('Begleitsatz hinten → nach dem Schlusszeichen kommt ein <b>Komma</b>: <i>„…“, sagte sie.</i>');if(/\.$/.test(inner))zs.push('Begleitsatz hinten → in der Rede steht <b>kein Punkt</b>.');if(!SAIDV.test(post))zs.push('Im Begleitsatz fehlt ein Verb des Sagens (sagte, erklärte, fragte …).');else if(/^,\s*[A-ZÄÖÜ]/.test(post)&&SAIDV.test(post.replace(/^,\s*/,'').split(/\s+/)[0]))zs.push('Nach <i>„…“,</i> geht der Begleitsatz <b>klein</b> weiter.');}
 if(/^[a-zäöü]/.test(inner))zs.push('Die direkte Rede beginnt mit einem <b>Großbuchstaben</b>.');
 if(it.q&&!/\?$/.test(inner))zs.push('Das ist eine Frage – das <b>Fragezeichen</b> steht in der Rede.');
 if(zs.length)zs.forEach(x=>add(false,x));else add(true,'Zeichensetzung und Begleitsatz');

 if(it.pron&&it.pron.length){const okp=hasW(inner,it.pron,'i').length>0;add(okp,okp?'Pronomen zurückverwandelt':`Wer selbst spricht, sagt <b>${it.pron.join(' / ')}</b> – nicht er/sie.`);}
 const src=it.ind.replace(/^[^,]*,\s*/,'');const miss=nounsOf(src).filter(w=>!hasWord(t,w));add(!miss.length,miss.length?'Vom Inhalt fehlt noch: <b>'+miss.map(esc).join(', ')+'</b>':'Inhalt vollständig');
 return {ok:L.every(x=>x.ok),list:L};}
function irPrompt(it,ans){return `${BASE}
Eine Schülerin soll diese Aussage in INDIREKTE Rede umwandeln.
Sprecher: ${it.who}

function headOf(r,lvl){return lvl===3?(r.fhead||''):(r.a.headline||'');}
function sumOf(r,lvl){return lvl===3?(r.fsum||''):(r.a.summary||'');}
function storyParas(r,lvl){return lvl===3?splitP(r.free):storyOf(r);}
function partsOf(r,lvl){if(lvl===3){const ps=storyParas(r,3);return [{kind:'headline',text:r.fhead||''},{kind:'summary',text:r.fsum||''},...ps.map((p,i)=>({kind:i===0?'haupt':'body',text:p}))];}
 return STEPS.map(s=>({kind:s.kind,text:r.a[s.k]||''}));}
function allAiErrs(r,lvl){if(lvl===3)return curErrs(r.ai.free,[r.fhead||'',r.fsum||'',r.free||''].join('\n'));return STEPS.flatMap(s=>curErrs(r.ai[s.k],r.a[s.k]||''));}
const SPR=['Rechtschreibung','Grammatik','Zeichensetzung','Satzbau','Großschreibung','Zeitform'];const STY=['Berichtsstil','Sachlichkeit','Wörtliche Rede','Ausdruck'];
const isTele=h=>!/^(ein|eine|der|die|das|den|dem)\s/i.test(h)&&!/(?<![a-zäöüß])(ist|sind|wurde|wurden|hat|haben|war|waren)(?![a-zäöüß])/i.test(h);
function evaluate(t,r,lvl){const head=headOf(r,lvl),sum=sumOf(r,lvl);const paras=storyParas(r,lvl);const body=paras.join('\n');const parts=partsOf(r,lvl);
 const issues=[];parts.forEach(p=>issues.push(...checkText(p.text,p.kind)));issues.push(...checkWhole(body));
 const wq=wCheck(t,[head,sum,body].join('\n'));const n=wc(body)+wc(sum);const aiE=allAiErrs(r,lvl);
 const inhalt=Math.round(25*wq.filter(x=>x.ok).length/wq.length);
 let auf=0;const ht=head.trim();if(ht)auf+=(wc(ht)<=10&&!/[.!]\s*$/.test(ht)&&isTele(ht))?5:3;
 const st=sum.trim();if(st){const ss=splitSentences(st);auf+=(ss.length<=2&&wc(st)<=45)?5:3;}
 const hp=parts.find(p=>p.kind==='haupt');if(hp&&hp.text.trim()){const f=splitSentences(hp.text)[0]||'';if(wc(f)<=4&&/\.$/.test(f))auf+=2;}
 const schl=lvl===3?(paras.length>=2&&wc(paras[paras.length-1])>=8):wc(r.a.schluss||'')>=8;if(schl)auf+=3;
 const len=n>=W[0]&&n<=W[1]?10:(n>=105&&n<=170?5:0);
 const bad=issues.filter(x=>x.lvl==='bad'),warn=issues.filter(x=>x.lvl==='warn');
 const cnt=(arr,cats)=>arr.filter(x=>cats.includes(x.cat)).length;
 const sprache=Math.max(0,Math.round(25-3*cnt(bad,SPR)-1.5*cnt(warn,SPR)-2*aiE.filter(e=>!/Berichtsstil|Ausdruck/.test(e.art)).length));
 const stil=Math.max(0,Math.round(15-5*cnt(bad,STY)-2*cnt(warn,STY)-2*aiE.filter(e=>/Berichtsstil|Ausdruck/.test(e.art)).length));
 const reps=findRepeats(body);const conn=CONN.filter(p=>wre(p).test(body)).length;const ber=BERICHT.filter(p=>wre(p).test(body)).length;
 const abw=Math.max(0,Math.min(10,Math.min(5,conn*2)+Math.min(5,ber))-2*reps.length-2*startRepeats(body).length);
 const fl=Math.min(1,n/W[0]);const sprF=Math.round(sprache*fl),stilF=Math.round(stil*fl),abwF=Math.round(abw*fl);
 const cats={};[...bad,...warn].forEach(x=>cats[x.cat]=(cats[x.cat]||0)+1);aiE.forEach(e=>{const k=e.art||'Grammatik';cats[k]=(cats[k]||0)+1;});
 return {total:inhalt+auf+len+sprF+stilF+abwF,parts:[['W-Fragen',inhalt,25],['Aufbau',auf,15],['Länge',len,10],['Sprache',sprF,25],['Berichtsstil',stilF,15],['Abwechslung',abwF,10]],n,issues,wq,reps,aiE,cats,head,sum,paras,body};}

 <div class="card"><div class="row" style="justify-content:space-between"><div><div class="score">${h.s}</div><div class="note">Durchschnitt der beiden Berichte</div></div><div class="note" style="text-align:right">${prev?`${h.s-prev.s>=0?'▲ +':'▼ '}${h.s-prev.s} zur letzten Runde`:'Erste Runde'}</div></div>
 <div class="tablewrap" style="margin-top:12px"><table><tr><th>Teil</th><th>Ergebnis</th></tr><tr><td>Regel-Check</td><td><b>${h.q[0]} / ${h.q[1]}</b> richtig</td></tr><tr><td>Direkte und indirekte Rede</td><td><b>${h.ir[0]} / ${h.ir[1]}</b> richtig</td></tr>${h.r.map((r,j)=>`<tr><td>Bericht ${j+1}: ${esc(T(r.t).title)}</td><td><b>${r.s}</b> Punkte</td></tr>`).join('')}</table></div>${c.lvlMsg?`<div style="margin-top:12px">${c.lvlMsg}</div>`:''}</div>
 <div class="card"><h3>Zusammenfassung</h3>${top.length?`<p>In dieser Runde kamen diese Fehlerarten am häufigsten vor: ${top.map(([k,v])=>`<b>${esc(k)}</b> (${v}×)`).join(', ')}. Darauf achtest du in der nächsten Runde besonders.</p>`:'<p>Beide Berichte waren sprachlich sehr sauber!</p>'}
 <p>Schreib <b>beide verbesserten Berichte ins Heft</b>.</p><div class="row"><button class="btn" id="again">Nächste Runde</button></div></div>${merkbox()}`;
 $('#again').onclick=()=>{S.cur=null;save();window.scrollTo({top:0});viewHome();};}

/* Start */
if(!S.name)viewStart();else if(S.cur)route();else viewHome();

</script>
</body>
