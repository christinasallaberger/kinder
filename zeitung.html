<style>
:root{--paper:#F3F4EE;--surface:#FFFFFF;--clip:#FBFBF6;--ink:#1F2A23;--soft:#5B6A5F;--line:#D8DED2;--marker:#D4EC8E;--accent:#2E6B3C;--accent-ink:#FFFFFF;--chip:#EAF0E1;--ok:#1E7A45;--ok-bg:#E3F5EA;--warn:#8A5A00;--warn-bg:#FFF3D6;--bad:#B8213A;--bad-bg:#FCE6E9;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#131A15;--surface:#1B241E;--clip:#202A23;--ink:#E7EEE6;--soft:#A3B2A6;--line:#2E3B32;--marker:#4B6A1F;--accent:#B7DD6A;--accent-ink:#131A15;--chip:#24302A;--ok:#7FDCA4;--ok-bg:#16382A;--warn:#FFD27A;--warn-bg:#3D3215;--bad:#FF95A5;--bad-bg:#4A1C27;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#131A15;--surface:#1B241E;--clip:#202A23;--ink:#E7EEE6;--soft:#A3B2A6;--line:#2E3B32;--marker:#4B6A1F;--accent:#B7DD6A;--accent-ink:#131A15;--chip:#24302A;--ok:#7FDCA4;--ok-bg:#16382A;--warn:#FFD27A;--warn-bg:#3D3215;--bad:#FF95A5;--bad-bg:#4A1C27;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.55 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 90px}
h1,h2,h3{font-family:"Newsreader",Georgia,"Times New Roman",serif;line-height:1.12;margin:0}
h1{font-size:clamp(34px,9vw,52px);font-weight:800;letter-spacing:-.015em}
h2{font-size:26px;font-weight:700;margin:4px 0 8px}h3{font-size:20px;font-weight:700;margin:0 0 6px}
.mark{background:linear-gradient(transparent 58%,var(--marker) 58%,var(--marker) 92%,transparent 92%)}
.sub{color:var(--soft);margin:6px 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.s{background:var(--chip);color:var(--ink)}.btn.sm{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
input[type=text],textarea{font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:10px;width:100%}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,.btn:focus-visible,.chip:focus-visible,.opt:focus-visible,.task:focus-visible{outline:3px solid var(--marker);outline-offset:1px}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--chip)}
.who{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.lvl{display:flex;gap:6px}.lvl span{width:30px;height:8px;border-radius:4px;background:var(--line)}.lvl span.on{background:var(--accent)}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.task{text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px;font:inherit;cursor:pointer;position:relative}
.task.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.task b{display:block;font-family:"Newsreader",Georgia,serif;font-size:18px;line-height:1.2;padding-right:22px}.task small{color:var(--soft)}
.task .done{display:block;font-size:12px;color:var(--ok);font-weight:700}.task .num{position:absolute;top:8px;right:10px;font-weight:800;color:var(--accent)}
.steps{display:flex;gap:4px;margin:10px 0 14px}.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--accent)}.steps i.ok{background:var(--ok)}.steps i.no{background:var(--bad)}
.de{color:var(--soft);font-size:15px;margin:2px 0 10px}
.rule{background:var(--chip);border-left:4px solid var(--accent);border-radius:6px;padding:6px 10px;font-size:15px;margin:6px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:5px 11px;font:inherit;font-size:14px;cursor:pointer}
.keys{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}.keys .chip{border-radius:8px;min-width:38px;font-weight:700}
.example{display:none;background:var(--chip);border-radius:10px;padding:8px 12px;margin:8px 0;font-style:italic}.example.show{display:block}
.fb{margin-top:10px;display:flex;flex-direction:column;gap:6px}.fb:empty{display:none}
.f{border-radius:10px;padding:7px 10px;font-size:15px}
.f.bad{background:var(--bad-bg);color:var(--bad)}.f.warn{background:var(--warn-bg);color:var(--warn)}.f.ok{background:var(--ok-bg);color:var(--ok)}
.f b{font-weight:700}.f .q{font-style:italic;opacity:.9}.f .ex{color:var(--ink)}
.wc{font-size:14px;color:var(--soft)}.wc.in{color:var(--ok);font-weight:700}
.clip{background:var(--clip);border:1px solid var(--line);border-radius:4px;padding:16px 18px;font-family:"Newsreader",Georgia,serif;font-size:18px;line-height:1.5;box-shadow:3px 3px 0 var(--line)}
.clip .hl{font-size:clamp(22px,6vw,30px);font-weight:800;line-height:1.1;margin:0 0 10px;letter-spacing:-.01em}
.clip .hl.empty{color:var(--soft);font-weight:500;font-style:italic;font-size:18px}
.clip p{margin:0 0 10px}.clip p.lead{font-weight:700}.clip .by{font-size:14px;color:var(--soft);text-align:right;margin:0}
mark.er{background:transparent;color:inherit;text-decoration:underline wavy var(--bad);text-decoration-thickness:2px;text-underline-offset:3px}
mark.rp{color:#1F2A23;border-radius:3px;padding:0 2px}
sup.en{font-family:"Atkinson Hyperlegible",sans-serif;font-size:11px;font-weight:700;color:var(--bad);margin-left:1px}
.score{font-family:"Newsreader",Georgia,serif;font-size:60px;font-weight:800;line-height:1}
.bars{display:grid;grid-template-columns:110px 1fr 54px;gap:6px 10px;align-items:center;font-size:15px}
.bars .b{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.bars .b i{display:block;height:100%;background:var(--accent)}
.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:15px}td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.facts td:first-child{font-weight:700;white-space:nowrap;padding-right:10px}
.wit{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin:10px 0}.wit b{display:block}
.merk{background:var(--chip);border-radius:12px;padding:14px}
.note{font-size:14px;color:var(--soft)}
.hidden{display:none!important}
.timer{font-weight:700;font-variant-numeric:tabular-nums}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;cursor:pointer}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.phr h4{margin:10px 0 4px;font-size:15px}.phr ul{margin:0;padding-left:18px}.phr li{margin:2px 0}
.rules{margin:6px 0;padding-left:20px}.rules li{margin:3px 0}
.aist{font-size:14px;color:var(--soft);margin-top:8px}.aist:empty{display:none}
.modal{position:fixed;inset:0;background:rgba(10,20,12,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.mbox{background:var(--surface);color:var(--ink);border-radius:14px;padding:18px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.mbox p{margin:0 0 14px}
details>summary{cursor:pointer}
@media (max-width:480px){.bars{grid-template-columns:96px 1fr 46px}.clip{padding:14px}}
</style>

/* ===================== HILFSFUNKTIONEN ===================== */
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const LT='a-zäöüßA-ZÄÖÜ';
function wre(p,fl='i'){return new RegExp('(?<!['+LT+'])'+reEsc(p).replace(/\s+/g,'\\s+')+'(?!['+LT+'])',fl);}
const words=t=>(String(t||'').match(/[A-Za-zÄÖÜäöüß0-9]+(?:[-’'][A-Za-zÄÖÜäöüß0-9]+)*/g)||[]);
const wc=t=>words(t).length;
const W=[120,150];

/* ===================== AUFGABEN ===================== */
/* type 'notizen' = Bericht mit freier Hand (Reporter-Notizen oder umgangssprachliche Zeugenaussage)
   type 'angaben' = Bericht mit vielen Angaben (Eckdaten + Aussagen der handelnden Personen) */
const TASKS=[
{id:'fussgaenger',type:'notizen',title:'Schüler von Auto erfasst',de:'Reporter-Notizen',ort:'St. Johann im Pongau',
 notes:'Verkehrsunfall – Fußgänger – Schüler Muammar I. (13) – Heimweg von der Schule – Brechtstraße, St. Johann im Pongau – Donnerstag, 21. Juni, 13.30 Uhr – PKW-Lenkerin Madlen M. (35) – konnte nicht mehr bremsen – Motorhaube – Zeugen – Rettung – leicht verletzt – Blechschaden',
 keys:[{f:'Wer? (Opfer)',h:'Muammar I. (13)',w:['Muammar','13-jährig','13-Jährig','Schüler']},{f:'Wer? (Lenkerin)',h:'Madlen M. (35)',w:['Madlen','Lenkerin','35-J','Fahrerin']},{f:'Wo?',h:'Brechtstraße, St. Johann',w:['Brechtstraße','Brechtstrasse','St. Johann']},{f:'Wann?',h:'21. Juni, 13.30 Uhr',w:['21. Juni','Donnerstag','13.30','13:30']},{f:'Wie?',h:'konnte nicht mehr bremsen, Motorhaube',w:['bremse','Motorhaube','erfasst','kollid']},{f:'Folgen?',h:'leicht verletzt, Blechschaden',w:['leicht verletzt','leichte Verletzung','Blechschaden','Sachschaden']}],
 model:{headline:'Schüler auf dem Heimweg von Auto erfasst',summary:'Ein 13-jähriger Schüler wurde am Donnerstag in St. Johann im Pongau von einem PKW erfasst. Er erlitt leichte Verletzungen.',hauptteil:'St. Johann im Pongau. Am 21. Juni war Muammar I. (13) gegen 13.30 Uhr auf dem Heimweg von der Schule. In der Brechtstraße betrat er die Fahrbahn, als sich gerade der PKW von Madlen M. (35) näherte. Die Lenkerin bremste sofort, konnte ihr Fahrzeug aber nicht mehr rechtzeitig anhalten. Der Bub wurde auf die Motorhaube geschleudert. Augenzeugen verständigten umgehend die Rettung, die den Schüler ins Krankenhaus brachte. Kurz darauf traf auch eine Polizeistreife ein und sicherte die Unfallstelle ab.',schluss:'Laut den Ärzten erlitt der 13-Jährige nur leichte Verletzungen. Am Wagen der 35-Jährigen entstand Blechschaden. Die Brechtstraße war während der Unfallaufnahme kurzzeitig gesperrt. Die Polizei ermittelt nun den genauen Unfallhergang.'}},
{id:'radweg',type:'notizen',title:'Zusammenstoß auf dem Radweg',de:'Reporter-Notizen',ort:'Wels',
 notes:'Zusammenstoß – Traunradweg bei Wels – Samstag, 14. September, 10.15 Uhr – Schülerin Lena F. (12), Fahrrad – E-Bike-Fahrer Herbert K. (58) – überholte zu knapp – Sturz in Böschung – Helm – Spaziergängerin, Erste Hilfe – Klinikum Wels – Handgelenk gebrochen – Polizei: Abstand halten',
 keys:[{f:'Wer? (Schülerin)',h:'Lena F. (12)',w:['Lena','12-J','Schülerin','Radfahrerin']},{f:'Wer? (E-Bike)',h:'Herbert K. (58)',w:['Herbert','58-J','E-Bike']},{f:'Wo?',h:'Traunradweg bei Wels',w:['Traunradweg','Radweg']},{f:'Wann?',h:'14. September, 10.15 Uhr',w:['14. September','Samstag','10.15','10:15']},{f:'Wie?',h:'zu knapp überholt, Sturz in Böschung',w:['überhol','Böschung','Abstand']},{f:'Folgen?',h:'Handgelenk gebrochen',w:['Handgelenk','gebrochen','Bruch']}],
 model:{headline:'Radfahrerin nach Überholmanöver verletzt',summary:'Bei einem Zusammenstoß auf dem Traunradweg wurde am Samstag eine 12-jährige Radfahrerin verletzt. Ein E-Bike-Fahrer hatte zu knapp überholt.',hauptteil:'Wels. Am 14. September war Lena F. (12) gegen 10.15 Uhr mit ihrem Fahrrad auf dem Traunradweg unterwegs. Zur selben Zeit näherte sich von hinten der E-Bike-Fahrer Herbert K. (58) mit hoher Geschwindigkeit. Beim Überholen hielt er zu wenig Abstand, sodass sich die Lenker der beiden Räder berührten. Die Schülerin verlor das Gleichgewicht und stürzte in die Böschung. Eine Spaziergängerin leistete Erste Hilfe und verständigte die Rettung. Auch Herbert K. hielt an und kümmerte sich um die Verletzte.',schluss:'Die 12-Jährige wurde ins Klinikum Wels gebracht. Sie erlitt einen Bruch des Handgelenks, ihr Helm verhinderte Kopfverletzungen. Der 58-Jährige blieb unverletzt. Die Polizei appelliert an alle Radfahrer, beim Überholen Abstand zu halten.'}},
{id:'mure',type:'notizen',title:'Mure verschüttet Straße',de:'Reporter-Notizen',ort:'Arzl im Pitztal',

 keys:[{f:'Wer?',h:'7 Insassen in 3 Autos',w:['sieben','Insassen','drei Autos','7 ']},{f:'Wo?',h:'Pitztal, Arzl',w:['Pitztal','Arzl']},{f:'Wann?',h:'27. Juli, 21 Uhr',w:['27. Juli','Sonntag','21 Uhr']},{f:'Was?',h:'Mure verschüttet Straße',w:['Mure','verschüttet','Schlamm','Geröll']},{f:'Wie?',h:'Starkregen, Bagger',w:['Starkregen','Gewitter','Unwetter','Bagger']},{f:'Folgen?',h:'niemand verletzt, gesperrt',w:['niemand','gesperrt','Geologe']}],
 model:{headline:'Mure verschüttet Straße ins Pitztal',summary:'Nach einem heftigen Gewitter verschüttete am Sonntag eine Mure die Landesstraße ins Pitztal. Sieben Menschen saßen in ihren Autos fest.',hauptteil:'Arzl im Pitztal. Am 27. Juli ging gegen 21 Uhr ein Unwetter mit Starkregen über dem Tal nieder. Dadurch rutschte oberhalb der Straße ein Hang ab, und Schlamm sowie Geröll bedeckten die Fahrbahn auf einer Länge von rund 50 Metern. Drei Autos mit insgesamt sieben Insassen wurden eingeschlossen und konnten weder vor noch zurück. Feuerwehren aus drei Gemeinden rückten aus und räumten mit Baggern einen Weg frei. Nach etwa zwei Stunden waren alle Betroffenen befreit.',schluss:'Verletzt wurde niemand. Die Straße bleibt bis Dienstag gesperrt, da ein Geologe den Hang noch untersuchen muss. Bis dahin müssen die Bewohner des Tals eine Umleitung nehmen.'}},
{id:'kater',type:'notizen',title:'Kater sitzt auf Baum fest',de:'Reporter-Notizen',ort:'Klagenfurt',
 notes:'Feuerwehreinsatz – Kater Moritz – 15 Meter hohe Pappel – Park am Lendkanal, Klagenfurt – Freitagabend, 9. Mai, bis Samstag, 10. Mai, 15 Uhr – hat Vogel gejagt – Besitzerin Elif Y. (10) – Futter half nicht – Drehleiter – unverletzt, hungrig',
 keys:[{f:'Wer?',h:'Kater Moritz, Elif Y. (10)',w:['Moritz','Kater','Elif']},{f:'Wo?',h:'Lendkanal, Klagenfurt',w:['Lendkanal','Klagenfurt','Pappel']},{f:'Wann?',h:'9./10. Mai',w:['9. Mai','10. Mai','Freitag','Samstag']},{f:'Wie?',h:'Vogel gejagt, Drehleiter',w:['Vogel','Drehleiter']},{f:'Folgen?',h:'unverletzt, hungrig',w:['unverletzt','hungrig']}],
 model:{headline:'Feuerwehr holt Kater nach 20 Stunden vom Baum',summary:'In Klagenfurt befreite die Feuerwehr am Samstag einen Kater aus einer Baumkrone. Das Tier war dort rund 20 Stunden festgesessen.',hauptteil:'Klagenfurt. Am Freitagabend, dem 9. Mai, jagte Kater Moritz im Park am Lendkanal einem Vogel nach und kletterte dabei auf eine 15 Meter hohe Pappel. Danach traute sich das Tier nicht mehr hinunter. Seine Besitzerin, die zehnjährige Elif Y., versuchte gemeinsam mit ihrer Familie vergeblich, den Vierbeiner mit Futter anzulocken. Am Samstag verständigte sie schließlich die Feuerwehr. Gegen 15 Uhr fuhr ein Feuerwehrmann mit der Drehleiter in die Baumkrone und holte Moritz sicher herunter. Zahlreiche Spaziergänger verfolgten die Rettungsaktion.',schluss:'Der Kater blieb unverletzt, war aber sehr hungrig. Elif brachte ihn anschließend nach Hause und gab ihm sofort zu fressen. Laut den Einsatzkräften sollte man spätestens nach einem Tag Hilfe holen.'}},
{id:'pony',type:'notizen',title:'Pony auf der Bundesstraße',de:'Reporter-Notizen',ort:'Enns',
 notes:'Pony entlaufen – Pony Flocke vom Reiterhof – B1 zwischen Enns und Asten – Montag, 7. April, 7.20 Uhr – Weidetor offen – Polizei sperrt Straße – Besitzerin Anna G. (31) – Karotten – 30 Minuten Stau – niemand verletzt',
 keys:[{f:'Wer?',h:'Pony Flocke, Anna G. (31)',w:['Pony','Flocke']},{f:'Wo?',h:'B1, Enns – Asten',w:['B1','Enns','Asten','Bundesstraße']},{f:'Wann?',h:'7. April, 7.20 Uhr',w:['7. April','Montag','7.20','7:20']},{f:'Wie?',h:'Weidetor offen, Karotten',w:['Tor','Weide','Karotte']},{f:'Folgen?',h:'Stau, niemand verletzt',w:['Stau','niemand','unverletzt']}],
 model:{headline:'Entlaufenes Pony sorgt für Stau auf der B1',summary:'Ein entlaufenes Pony legte am Montag den Frühverkehr auf der B1 bei Enns lahm. Verletzt wurde niemand.',hauptteil:'Enns. Am 7. April bemerkten mehrere Autofahrer gegen 7.20 Uhr ein Pony, das zwischen Enns und Asten auf der Bundesstraße trabte. Einige Lenker mussten stark abbremsen. Das Tier war von der Weide eines nahe gelegenen Reiterhofs entkommen, weil das Tor offen gestanden war. Zwei Polizeistreifen sperrten die Fahrbahn daraufhin kurzzeitig ab. Wenig später traf die Besitzerin Anna G. (31) ein und lockte das Tier mit Karotten von der Straße. Anschließend brachte sie es zurück in den Stall.',schluss:'Durch den Vorfall bildete sich ein etwa 30 Minuten langer Stau. Verletzt wurde niemand, auch das Pony Flocke blieb unverletzt. Der Reiterhof will das Weidetor nun mit einem zusätzlichen Schloss sichern.'}},
{id:'b129',type:'notizen',title:'Motorradunfall auf der B129',de:'Reporter-Notizen',ort:'Wilhering',
 notes:'Verkehrsunfall – schwer – Bundesstraße 129 – Kreuzung Wilhering – 17. November – Motorrad – Vorrang missachtet – 1 Toter (Manfred S., 36) – 2 Verletzte (Susanne O., 32, und Sohn Theo, 5 Monate) – Feuerwehr – Bergeschere – Straße bis Mitternacht gesperrt',
 keys:[{f:'Wer? (Motorrad)',h:'Manfred S. (36)',w:['Manfred','36-J','Motorrad']},{f:'Wer? (PKW)',h:'Susanne O. (32), Sohn Theo',w:['Susanne','32-J','Theo','Sohn']},{f:'Wo?',h:'B129, Kreuzung Wilhering',w:['B129','Bundesstraße 129','Wilhering']},{f:'Wann?',h:'17. November',w:['17. November']},{f:'Wie?',h:'Vorrang missachtet',w:['Vorrang']},{f:'Folgen?',h:'1 Toter, 2 Verletzte, gesperrt',w:['ums Leben','tödlich','starb','erlag','zu spät','verletzt','gesperrt']}],
 model:{headline:'Motorradfahrer auf der B129 tödlich verunglückt',summary:'Bei einem schweren Verkehrsunfall auf der B129 kam am 17. November ein Motorradfahrer ums Leben. Eine Mutter und ihr Baby wurden verletzt.',hauptteil:'Wilhering. Manfred S. (36) war mit seinem Motorrad auf der Bundesstraße 129 unterwegs. An der Kreuzung Wilhering missachtete er vermutlich die Vorrangregel. Zur selben Zeit fuhr Susanne O. (32) mit ihrem PKW in die Kreuzung ein, auf der Rückbank saß ihr fünf Monate alter Sohn Theo. Die beiden Fahrzeuge prallten zusammen, der Motorradfahrer stürzte auf die Fahrbahn. Augenzeugen verständigten sofort die Einsatzkräfte. Die Feuerwehr musste Mutter und Kind mit einer Bergeschere aus dem Wrack befreien.',schluss:'Für den 36-Jährigen kam jede Hilfe zu spät. Die 32-Jährige und ihr Sohn wurden verletzt ins Krankenhaus gebracht. Die B129 blieb bis Mitternacht gesperrt. Die Polizei ermittelt nun den genauen Unfallhergang.'}},
{id:'tankstelle',type:'notizen',title:'Überfall auf Tankstelle',de:'Zeugenaussage in Umgangssprache',ort:'Ried im Innkreis',
 src:'Aus der Zeugenaussage von Tobias Wimmer (31) über einen Überfall auf eine Tankstelle in Ried im Innkreis am 3. Dezember:',
 wit:[{text:'„Boah, das ging voll schnell! Ein Typ mit Sturmhaube, so um halb sieben am Abend.“'},{text:'„Ich war grad beim Tanken und hab alles durch die Scheibe gesehen.“'},{text:'„Der hat dem Kassier ein Messer gezeigt und gesagt, er soll die Kassa ausräumen. So 2.000 Euro hat er mitgenommen, glaub ich.“'},{text:'„Dann ist er auf ein Moped und weg Richtung Bahnhof.“'},{text:'„Verletzt ist keiner worden, der Kassier war aber total fertig.“'},{text:'„Die Polizei war nach fünf Minuten da und hat überall gesucht – mit Hund und so. Erwischt haben sie ihn aber nicht.“'}],
 keys:[{f:'Wer? (Täter)',h:'maskierter Mann',w:['maskiert','Täter','Sturmhaube','Mann']},{f:'Wer? (Zeuge)',h:'Tobias W. (31)',w:['Tobias','Zeuge','31']},{f:'Wo?',h:'Tankstelle, Ried im Innkreis',w:['Ried','Tankstelle']},{f:'Wann?',h:'3. Dezember, 18.30 Uhr',w:['3. Dezember','18.30','18:30','halb sieben']},{f:'Wie?',h:'Messer, Flucht mit Moped',w:['Messer','Moped']},{f:'Folgen?',h:'2.000 Euro Beute, niemand verletzt, flüchtig',w:['2.000','2000','niemand','flüchtig','Flucht']}],
 model:{headline:'Bewaffneter Überfall auf Tankstelle in Ried',summary:'Ein unbekannter Täter überfiel am 3. Dezember eine Tankstelle in Ried im Innkreis. Er erbeutete rund 2.000 Euro und ist weiterhin auf der Flucht.',hauptteil:'Ried im Innkreis. Am 3. Dezember betrat gegen 18.30 Uhr ein Mann mit Sturmhaube die Tankstelle. Er bedrohte den Kassier mit einem Messer und forderte das Geld aus der Kassa. Laut dem Augenzeugen Tobias W. (31), der gerade tankte, erbeutete der Täter etwa 2.000 Euro. Der Zeuge beobachtete den gesamten Überfall durch die Scheibe. Anschließend flüchtete er auf einem Moped in Richtung Bahnhof. Die Polizei traf wenige Minuten später ein und leitete eine Fahndung mit einem Suchhund ein.',schluss:'Verletzt wurde niemand, der Kassier stand jedoch unter Schock. Trotz der sofortigen Suche mit einem Polizeihund fehlt von dem Täter jede Spur. Die Polizei bittet um Hinweise aus der Bevölkerung.'}},
{id:'scheune',type:'notizen',title:'Scheunenbrand in Eferding',de:'Zeugenaussage in Umgangssprache',ort:'Eferding',
 src:'Aus der Zeugenaussage von Gerti Mayr (67) über einen Brand auf dem Bauernhof ihres Nachbarn in Eferding am 12. August:',
 wit:[{text:'„Na, das war ein Wahnsinn! Um drei in der Früh hat’s auf einmal so komisch gerochen.“'},{text:'„Ich schau raus und die Scheune vom Nachbarn steht schon in Flammen. Sofort hab ich die Feuerwehr angerufen.“'},{text:'„Die waren mit fünf Wehren da, fast hundert Mann! Die Kühe haben sie Gott sei Dank noch alle rausgebracht.“'},{text:'„Löschen hat ewig gedauert, so um sieben war’s vorbei.“'},{text:'„Die Scheune ist komplett hin, das ganze Heu auch. Die sagen, mindestens 300.000 Euro Schaden.“'},{text:'„Warum’s gebrannt hat? Keine Ahnung, die Polizei schaut sich das jetzt an.“'}],
 keys:[{f:'Wer?',h:'Nachbarin Gerti M. (67), Feuerwehren',w:['Gerti','Nachbarin','67']},{f:'Wo?',h:'Bauernhof in Eferding',w:['Eferding','Bauernhof','Scheune']},{f:'Wann?',h:'12. August, 3 Uhr',w:['12. August','3 Uhr']},{f:'Wie?',h:'Brandgeruch, Feuerwehr gerufen, Kühe gerettet',w:['Kühe','Feuerwehr']},{f:'Folgen?',h:'Scheune zerstört, 300.000 Euro, Ursache unklar',w:['300.000','300000','zerstört','Ursache','ermittelt']}],
 model:{headline:'Großbrand zerstört Scheune in Eferding',summary:'Bei einem Großbrand in Eferding wurde am 12. August eine Scheune völlig zerstört. Alle Tiere konnten gerettet werden.',hauptteil:'Eferding. Am 12. August bemerkte gegen 3 Uhr früh die Nachbarin Gerti M. (67) Brandgeruch. Als sie aus dem Fenster blickte, stand die Scheune eines landwirtschaftlichen Betriebs bereits in Flammen, die schon von Weitem zu sehen waren. Sie verständigte sofort die Feuerwehr. Fünf Feuerwehren mit fast 100 Einsatzkräften rückten aus. Zunächst brachten die Helfer alle Kühe aus dem angrenzenden Stall in Sicherheit. Die Löscharbeiten dauerten bis etwa 7 Uhr.',schluss:'Verletzt wurde niemand. Die Scheune und die Heuvorräte wurden völlig zerstört, der Schaden beträgt mindestens 300.000 Euro. Die Feuerwehr hielt noch bis zum Vormittag Brandwache. Die Brandursache ist noch unklar, die Polizei ermittelt.'}},
{id:'kuehe',type:'angaben',title:'Kühe auf der Autobahn',de:'Eckdaten + 4 Personen',ort:'Seewalchen',
 info:'2. Oktober, 6.40 Uhr, im Gemeindegebiet von Seewalchen, Kühe auf der Westautobahn (A1), Auffahrunfall mit Sachschaden, Polizei treibt die Tiere zusammen, Bauer holt sie mit dem Viehanhänger, A1 Richtung Salzburg eineinhalb Stunden gesperrt.',
 wit:[{who:'Landwirtin Monika S. (48)',text:'„Ein Gewitter in der Nacht hat die Tiere unruhig gemacht. Sechs Kühe haben den Weidezaun niedergerissen. Als ich es bemerkt habe, habe ich sofort die Polizei verständigt.“'},{who:'Polizist Gerhard T. (39)',text:'„Wir haben die Autobahn in Fahrtrichtung Salzburg sofort gesperrt. Mit vier Streifen haben wir die Kühe auf einen Parkplatz getrieben.“'},{who:'Autolenker Kevin P. (23)',text:'„Plötzlich standen zwei Kühe mitten auf der Fahrbahn. Ich musste eine Vollbremsung machen. Der Wagen hinter mir ist mir hinten aufgefahren. Zum Glück ist niemand verletzt worden.“'},{who:'Landwirt Josef S. (52)',text:'„Ich bin mit dem Viehanhänger gekommen und habe die Kühe zurück auf den Hof gebracht. Keinem Tier ist etwas passiert.“'}],
 keys:[{f:'Wer?',h:'Kühe, Kevin P. (23), Polizei, Landwirte',w:['Kühe','Kevin','Monika','Josef']},{f:'Wo?',h:'A1 bei Seewalchen',w:['A1','Westautobahn','Seewalchen']},{f:'Wann?',h:'2. Oktober, 6.40 Uhr',w:['2. Oktober','6.40','6:40']},{f:'Was?',h:'Auffahrunfall',w:['aufgefahren','auffuhr','Auffahrunfall']},{f:'Wie?',h:'Zaun niedergerissen, Parkplatz, Viehanhänger',w:['Zaun','Parkplatz','Viehanhänger','Anhänger']},{f:'Folgen?',h:'Sachschaden, 1,5 Stunden gesperrt',w:['Sachschaden','gesperrt','eineinhalb']}],
 model:{headline:'Entlaufene Kühe legen Westautobahn lahm',summary:'Sechs entlaufene Kühe verursachten am 2. Oktober auf der Westautobahn bei Seewalchen einen Auffahrunfall. Die A1 war eineinhalb Stunden gesperrt.',hauptteil:'Seewalchen. In der Nacht hatte ein Gewitter die Tiere eines Bauernhofs unruhig gemacht. Laut Landwirtin Monika S. (48) hätten sechs Kühe den Weidezaun niedergerissen. Die Landwirtin verständigte sofort die Polizei. Gegen 6.40 Uhr standen plötzlich zwei von ihnen auf der Fahrbahn der A1. Autolenker Kevin P. (23) musste eine Vollbremsung machen, worauf ein nachfolgender Wagen auffuhr. Die Polizei sperrte die Autobahn in Richtung Salzburg und trieb die Kühe mit vier Streifen auf einen Parkplatz.',schluss:'Verletzt wurde niemand, an beiden Autos entstand Sachschaden. Landwirt Josef S. (52) brachte die Tiere mit einem Viehanhänger unverletzt auf den Hof zurück. Die Autobahn war in Richtung Salzburg eineinhalb Stunden gesperrt.'}},
{id:'handymast',type:'angaben',title:'Jugendliche auf Handymast',de:'Eckdaten + 3 Personen',ort:'Wiener Neustadt',

 keys:[{f:'Wer?',h:'Samira L. (14)',w:['Samira','14-J','Jugendliche','Schülerin','Mädchen']},{f:'Wo?',h:'Austraße, Wiener Neustadt',w:['Wiener Neustadt','Austraße']},{f:'Wann?',h:'24. Oktober, Freitagabend',w:['24. Oktober','Freitag']},{f:'Was?',h:'auf Handymast geklettert',w:['Handymast','Mast']},{f:'Wie?',h:'schwindelig, Drehleiter',w:['schwindel','Drehleiter','Panik']},{f:'Folgen?',h:'unverletzt, Eltern zahlen',w:['unverletzt','niemand','Kosten','bezahlen','verboten']}],
 model:{headline:'14-Jährige mit Drehleiter von Handymast geholt',summary:'In Wiener Neustadt musste die Feuerwehr am Freitagabend eine 14-Jährige von einem Handymast holen. Das Mädchen blieb unverletzt.',hauptteil:'Wiener Neustadt. Am 24. Oktober wollte die Schülerin Samira L. (14) mit ihren Freundinnen den Sonnenuntergang filmen. Dafür kletterte sie in der Austraße auf einen Handymast. Oben wurde ihr plötzlich schwindelig, und sie traute sich nicht mehr hinunter. Ihre Freundinnen, die von unten zusahen, verständigten daraufhin die Einsatzkräfte. Laut Feuerwehrkommandant Hendrik G. sei die Jugendliche völlig in Panik gewesen. Mithilfe der Drehleiter brachten die Helfer sie nach einer Viertelstunde sicher zu Boden.',schluss:'Verletzt wurde niemand. Wie Polizeibeamtin Dilara K. betonte, sei das Klettern auf Handymasten verboten und lebensgefährlich. Die Kosten für den Einsatz müssen die Eltern übernehmen. Die Polizei warnt eindringlich vor solchen gefährlichen Mutproben.'}},
{id:'bergrettung',type:'angaben',title:'Wanderer im Nebel verirrt',de:'Eckdaten + 3 Personen',ort:'Puchberg am Schneeberg',

 model:{headline:'Wanderer im Nebel von Bergrettung gefunden',summary:'Am Schneeberg rettete die Bergrettung am 12. Oktober einen Wanderer, der sich im Nebel verirrt hatte. Der Mann war stark unterkühlt.',hauptteil:'Puchberg am Schneeberg. Thomas B. (42) brach gegen 9 Uhr allein zu einer Wanderung auf. Am Nachmittag zog plötzlich dichter Nebel auf, sodass er den Weg nicht mehr fand. Mit fast leerem Akku gelang es ihm gerade noch, den Notruf zu wählen. Die Bergrettung startete sofort einen Sucheinsatz. Laut Einsatzleiterin Karin S. seien zwölf Bergretter zu Fuß aufgestiegen, weil der Hubschrauber nicht fliegen konnte. Gegen 18 Uhr fanden die Helfer den Mann unterhalb des Gipfels.',schluss:'Der 42-Jährige wärmte sich anschließend in einer Hütte auf. Die Hüttenwirtin rät allen Wanderern, vor einer Tour den Wetterbericht zu beachten. Zuvor hatten ihn die Bergretter sicher ins Tal begleitet.'}},
{id:'eisteich',type:'angaben',title:'Bub bricht im Eis ein',de:'Eckdaten + 3 Personen',ort:'Wals-Siezenheim',
 info:'18. Jänner, 14 Uhr, Teich in Wals-Siezenheim, Elfjähriger bricht im Eis ein, Spaziergänger rettet ihn mit seinem Schal, Feuerwehr, Rettung bringt das Kind ins Krankenhaus, Polizei warnt vor dünnem Eis.',

 model:{headline:'Spaziergänger rettet Elfjährigen aus eisigem Teich',summary:'In Wals-Siezenheim brach am 18. Jänner ein elfjähriger Bub auf einem zugefrorenen Teich ein. Ein Spaziergänger zog ihn rechtzeitig ans Ufer.',hauptteil:'Wals-Siezenheim. Gegen 14 Uhr spazierte Markus R. (34) mit seinem Hund am Gewässer entlang, als er Hilferufe hörte. Der elfjährige Felix M. war mitten auf dem Teich durch das Eis gebrochen. Der 34-Jährige legte sich flach auf die Eisfläche, warf dem Buben seinen Schal zu und zog ihn so ans Ufer. Andere Spaziergänger verständigten in der Zwischenzeit die Feuerwehr. Laut Feuerwehrkommandant Florian E. sei das Kind völlig durchnässt und unterkühlt gewesen.',schluss:'Die Rettung brachte den Elfjährigen zur Kontrolle ins Krankenhaus. Laut Polizeisprecherin Sabine T. sei das Eis nur wenige Zentimeter dick. Die Polizei warnt davor, zugefrorene Gewässer zu betreten, solange sie nicht freigegeben sind.'}},
{id:'kuechenbrand',type:'angaben',title:'Küchenbrand in Graz',de:'Eckdaten + 4 Personen',ort:'Graz',
 info:'3. Dezember, 18.45 Uhr, Annenstraße in Graz, Küchenbrand im 3. Stock, Pfanne mit Öl, Rauchmelder, Nachbar hilft, Feuerwehr mit 25 Einsatzkräften, leichte Rauchgasvergiftung, Wohnung unbewohnbar.',

 model:{headline:'Nachbar rettet Pensionistin aus verrauchter Wohnung',summary:'Bei einem Küchenbrand in Graz wurde am 3. Dezember eine 79-jährige Frau leicht verletzt. Ein Nachbar half ihr aus der Wohnung.',hauptteil:'Graz. Gegen 18.45 Uhr vergaß Gertrude H. (79) in der Annenstraße eine Pfanne mit heißem Öl auf dem Herd. Das Öl fing Feuer, und kurz darauf schlug der Rauchmelder Alarm. Der 16-jährige Nachbar Lukas P. hörte das Piepsen, läutete sofort an der Tür und half der Pensionistin ins Freie. Anschließend verständigte er die Feuerwehr, die mit vier Fahrzeugen und 25 Einsatzkräften ausrückte. Laut Einsatzleiter Andreas W. sei der Brand nach rund 20 Minuten gelöscht gewesen.',schluss:'Die 79-Jährige erlitt eine leichte Rauchgasvergiftung und wurde zur Beobachtung ins Krankenhaus gebracht. Die Küche wurde durch die Flammen schwer beschädigt, die Wohnung ist derzeit unbewohnbar.'}},

const IRNORM=t=>String(t||'').toLowerCase().replace(/[„“”"‚‘’'.,!?:;–\-()]/g,' ').replace(/\s+/g,' ').trim();
const IRVERB=/(sagte|sagt|erklärte|berichtete|gab an|gab .* an|meinte|betonte|erzählte|teilte .*mit|teilte mit|schilderte|bestätigte|versicherte|laut|zufolge|wie .* (sagte|berichtete|erklärte|betonte))/;

function headOf(r,lvl){return lvl===3?(r.fhead||''):(r.a.headline||'');}
function sumOf(r,lvl){return lvl===3?(r.fsum||''):(r.a.summary||'');}
function storyParas(r,lvl){return lvl===3?splitP(r.free):storyOf(r);}
function partsOf(r,lvl){if(lvl===3){const ps=storyParas(r,3);return [{kind:'headline',text:r.fhead||''},{kind:'summary',text:r.fsum||''},...ps.map((p,i)=>({kind:i===0?'haupt':'body',text:p}))];}

function allAiErrs(r,lvl){if(lvl===3)return curErrs(r.ai.free,[r.fhead||'',r.fsum||'',r.free||''].join('\n'));return STEPS.flatMap(s=>curErrs(r.ai[s.k],r.a[s.k]||''));}
const SPR=['Rechtschreibung','Grammatik','Zeichensetzung','Satzbau','Großschreibung','Zeitform'];const STY=['Berichtsstil','Sachlichkeit','Wörtliche Rede','Ausdruck'];

function evaluate(t,r,lvl){const head=headOf(r,lvl),sum=sumOf(r,lvl);const paras=storyParas(r,lvl);const body=paras.join('\n');const parts=partsOf(r,lvl);

 const wq=wCheck(t,[head,sum,body].join('\n'));const n=wc(body)+wc(sum);const aiE=allAiErrs(r,lvl);
 const inhalt=Math.round(25*wq.filter(x=>x.ok).length/wq.length);
 let auf=0;const ht=head.trim();if(ht)auf+=(wc(ht)<=10&&!/[.!]\s*$/.test(ht)&&isTele(ht))?5:3;
 const st=sum.trim();if(st){const ss=splitSentences(st);auf+=(ss.length<=2&&wc(st)<=45)?5:3;}
 const hp=parts.find(p=>p.kind==='haupt');if(hp&&hp.text.trim()){const f=splitSentences(hp.text)[0]||'';if(wc(f)<=4&&/\.$/.test(f))auf+=2;}
 const schl=lvl===3?(paras.length>=2&&wc(paras[paras.length-1])>=8):wc(r.a.schluss||'')>=8;if(schl)auf+=3;

 const bad=issues.filter(x=>x.lvl==='bad'),warn=issues.filter(x=>x.lvl==='warn');
 const cnt=(arr,cats)=>arr.filter(x=>cats.includes(x.cat)).length;
 const sprache=Math.max(0,Math.round(25-3*cnt(bad,SPR)-1.5*cnt(warn,SPR)-2*aiE.filter(e=>!/Berichtsstil|Ausdruck/.test(e.art)).length));
 const stil=Math.max(0,Math.round(15-5*cnt(bad,STY)-2*cnt(warn,STY)-2*aiE.filter(e=>/Berichtsstil|Ausdruck/.test(e.art)).length));
 const reps=findRepeats(body);const conn=CONN.filter(p=>wre(p).test(body)).length;const ber=BERICHT.filter(p=>wre(p).test(body)).length;
 const abw=Math.max(0,Math.min(10,Math.min(5,conn*2)+Math.min(5,ber))-2*reps.length-2*startRepeats(body).length);
 const fl=Math.min(1,n/W[0]);const sprF=Math.round(sprache*fl),stilF=Math.round(stil*fl),abwF=Math.round(abw*fl);
 const cats={};[...bad,...warn].forEach(x=>cats[x.cat]=(cats[x.cat]||0)+1);aiE.forEach(e=>{const k=e.art||'Grammatik';cats[k]=(cats[k]||0)+1;});

"""${body}"""
Antworte NUR mit JSON, ohne Markdown:
{"lob":"1–2 Sätze auf Deutsch, was gut gelungen ist","aufbau":"1 Satz zu Headline, Summary, Hauptteil und Schluss","fehler":[{"original":"wörtlich kopierter, kurzer Ausschnitt (1–6 Wörter)","korrektur":"richtige Form","art":"${ART}","erklaerung":"kurz und kindgerecht"}],"wiederholungen":[{"wort":"wiederholtes Wort","alternativen":["2–4 passende Ersatzwörter oder Umformulierungen"]}],"tipps":["höchstens 3 konkrete Tipps mit Beispiel"],"verbessert":"der verbesserte Bericht: 1. Zeile Headline, 2. Zeile Summary, dann Absätze; Inhalt und Ideen der Schülerin behalten, nur Fehler und Stil verbessern"}
Höchstens 10 Fehler, die wichtigsten zuerst. Erfinde keine Fehler.`;}
function viewReport(){rerender=viewReport;const c=S.cur,r=c.reps[c.i],t=T(r.t);const ev=evaluate(t,r,c.level);const sv=r.saved||{s:ev.total,c:ev.cats,parts:ev.parts};
 const stars='★'.repeat(Math.round(sv.s/20))+'☆'.repeat(5-Math.round(sv.s/20));const mins=r.start?Math.round((Date.now()-r.start)/60000):null;const m=t.model;
 const top=Object.entries(sv.c||{}).sort((a,b)=>b[1]-a[1]).slice(0,3);
 app.innerHTML=`${header()}<h2>Auswertung Bericht ${c.i+1}: ${esc(t.title)}</h2>
 <div class="card"><div class="row" style="justify-content:space-between"><div><div class="score">${sv.s}</div><div class="note">von 100 Punkten · ${stars}</div></div><div class="note" style="text-align:right">${ev.n} Wörter (Ziel ${W[0]}–${W[1]})</div></div>
 <div class="bars" style="margin-top:14px">${(sv.parts||ev.parts).map(([n,v,mx])=>`<span>${n}</span><span class="b"><i style="width:${v/mx*100}%"></i></span><span>${v}/${mx}</span>`).join('')}</div></div>
 <div class="card"><h3>Dein Bericht</h3>${clipHTML(ev.head,ev.sum,ev.paras,ev.reps,ev.aiE)}<p class="note" style="margin:8px 0 0">Farbig: Wiederholungen · rot unterstrichen: Fehler</p></div>
 <div class="card"><h3>W-Fragen und Folgen</h3>${ev.wq.map(w=>`<div class="f ${w.ok?'ok':'warn'}" style="margin:4px 0">${w.ok?'✓':'!'} <b>${esc(w.f)}</b>${w.ok?'':` fehlt – z. B.: <i>${esc(w.h)}</i>`}</div>`).join('')}</div>
 <div class="card"><h3>Was du verbessern kannst</h3><div class="fb">${aiListHTML(ev.aiE)}${fbHTML(ev.issues.filter(x=>x.lvl!=='ok'))||(!ev.aiE.length?'<div class="f ok">✓ Keine Fehler gefunden – sehr gut!</div>':'')}</div><p class="note">Die Sofort-Kontrolle findet typische Fehler, aber nicht alle. Lies deinen Text immer noch einmal selbst durch.</p></div>
 <div class="card hidden" id="ai"><h3>Feedback von Claude</h3><div id="aiout"><p class="note">Claude liest deinen ganzen Bericht …</p></div></div>
 <details class="card"><summary><b>Musterbericht ansehen</b> <span class="note">– vergleiche: Was hat der Musterbericht, was dir noch fehlt?</span></summary><div style="margin-top:10px">${clipHTML(m.headline,m.summary,[m.hauptteil,m.schluss],[],[],false)}</div></details>
 <div class="card"><h3>Zusammenfassung</h3>${top.length?`<p>Achte beim nächsten Bericht besonders auf: ${top.map(([k,v])=>`<b>${esc(k)}</b> (${v}×)`).join(', ')}.</p>`:'<p>Dieser Bericht war sprachlich sehr sauber!</p>'}
 ${mins!==null&&c.level===3?`<p class="note">Schreibzeit: etwa ${mins} Minuten${mins>25?' – bei der Schularbeit musst du zwei Berichte schaffen. Übe, schneller zu werden!':'.'}</p>`:''}
 <p>Schreib den <b>verbesserten Bericht ins Heft</b> – mit allen Korrekturen.</p>
 <div class="row"><button class="btn" id="nx">${c.i===0?'Weiter zu Bericht 2':'Zur Rundenauswertung'}</button></div></div>`;
 $('#nx').onclick=()=>{if(c.i===0){c.i=1;c.phase='intro';save();window.scrollTo({top:0});viewIntro();}else endRound();};
 runFinal(t,r,ev);}
async function runFinal(t,r,ev){const sm=await getSample();if(!sm||aiOff)return;const box=$('#ai');if(!box)return;box.classList.remove('hidden');const out=$('#aiout');
 const key=[ev.head,ev.sum,ev.body].join('\n');if(r.fin&&r.fin.key===key)return showFinal(r.fin.data);
 try{const d=await sm.json(finalPrompt(t,ev.head,ev.sum,ev.paras.join('\n\n')));r.fin={key,data:d};save();if(document.body.contains(out))showFinal(d);}
 catch(e){if(e&&e.code==='not_granted'){aiOff=true;box.classList.add('hidden');return;}if(document.body.contains(out)){out.innerHTML=`<div class="f warn">${aiErrMsg(e)}</div><div class="row" style="margin-top:8px"><button class="btn s sm" id="aiR">Nochmal versuchen</button></div>`;$('#aiR').onclick=()=>{out.innerHTML='<p class="note">Claude liest deinen ganzen Bericht …</p>';runFinal(t,r,ev);};}}}
function showFinal(d){const out=$('#aiout');if(!out||!d)return;const errs=normErrs(d.fehler);const reps=Array.isArray(d.wiederholungen)?d.wiederholungen:[];const tips=Array.isArray(d.tipps)?d.tipps:[];
 out.innerHTML=`${d.lob?`<div class="f ok">✓ ${esc(d.lob)}</div>`:''}${d.aufbau?`<p style="margin:10px 0 0"><b>Aufbau:</b> ${esc(d.aufbau)}</p>`:''}
 ${errs.length?`<h3 style="margin-top:12px">Fehler</h3><div class="fb">${aiListHTML(errs)}</div>`:''}
 ${reps.length?`<h3 style="margin-top:12px">Wortwiederholungen – so geht es abwechslungsreicher</h3><div class="fb">${reps.map(w=>`<div class="f warn">! <b>${esc(w.wort)}</b> → ${(Array.isArray(w.alternativen)?w.alternativen:[]).map(esc).join(', ')}</div>`).join('')}</div>`:''}
 ${tips.length?`<h3 style="margin-top:12px">Tipps</h3><ul>${tips.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
 ${d.verbessert?`<h3 style="margin-top:12px">Verbesserte Version</h3>${(()=>{const ls=splitP(d.verbessert);return clipHTML(ls[0]||'',ls[1]||'',ls.slice(2),[],[],false);})()}`:''}`;}
function endRound(){const c=S.cur;const scores=c.reps.map(r=>r.saved?r.saved.s:0);const avg=Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);const Q=c.quiz,I=c.ir;const lvlBefore=c.level;
 S.hist.push({d:Math.floor(Date.now()/864e5),l:lvlBefore,hp:c.help?1:0,q:[Q.ans.filter(Boolean).length,Q.ids.length],ir:[I.out.filter(x=>x&&x.ok).length,I.ids.length],s:avg,r:c.reps.map(r=>({t:r.t,s:r.saved?r.saved.s:0,c:r.saved?r.saved.c:{},x:r.saved?r.saved.x:''}))});
 c.lvlMsg='';if(avg>=75&&S.level<3&&S.level===lvlBefore){S.level++;c.lvlMsg=`<div class="f ok">🎉 Super! Du steigst auf <b>Stufe ${S.level}</b> auf: ${LEVELS[S.level].split('– ')[1]}.</div>`;}
 else if(avg<50&&lvlBefore>1)c.lvlMsg=`<div class="f warn">Tipp: Probier die nächste Runde noch einmal auf <b>Stufe ${lvlBefore-1}</b> (auf der Startseite einstellbar).</div>`;
 c.phase='round';save();window.scrollTo({top:0});viewRound();}
function viewRound(){rerender=viewRound;const c=S.cur;const h=S.hist[S.hist.length-1];const prev=S.hist.length>1?S.hist[S.hist.length-2]:null;
 const agg={};h.r.forEach(r=>Object.entries(r.c||{}).forEach(([k,v])=>agg[k]=(agg[k]||0)+v));const top=Object.entries(agg).sort((a,b)=>b[1]-a[1]).slice(0,3);
 app.innerHTML=`${header()}<h2>Rundenauswertung</h2>
 <div class="card"><div class="row" style="justify-content:space-between"><div><div class="score">${h.s}</div><div class="note">Durchschnitt der beiden Berichte</div></div><div class="note" style="text-align:right">${prev?`${h.s-prev.s>=0?'▲ +':'▼ '}${h.s-prev.s} zur letzten Runde`:'Erste Runde'}</div></div>
 <div class="tablewrap" style="margin-top:12px"><table><tr><th>Teil</th><th>Ergebnis</th></tr><tr><td>Regel-Check</td><td><b>${h.q[0]} / ${h.q[1]}</b> richtig</td></tr><tr><td>Indirekte Rede</td><td><b>${h.ir[0]} / ${h.ir[1]}</b> richtig</td></tr>${h.r.map((r,j)=>`<tr><td>Bericht ${j+1}: ${esc(T(r.t).title)}</td><td><b>${r.s}</b> Punkte</td></tr>`).join('')}</table></div>${c.lvlMsg?`<div style="margin-top:12px">${c.lvlMsg}</div>`:''}</div>
 <div class="card"><h3>Zusammenfassung</h3>${top.length?`<p>In dieser Runde kamen diese Fehlerarten am häufigsten vor: ${top.map(([k,v])=>`<b>${esc(k)}</b> (${v}×)`).join(', ')}. Darauf achtest du in der nächsten Runde besonders.</p>`:'<p>Beide Berichte waren sprachlich sehr sauber!</p>'}
 <p>Schreib <b>beide verbesserten Berichte ins Heft</b>.</p><div class="row"><button class="btn" id="again">Nächste Runde</button></div></div>${merkbox()}`;
 $('#again').onclick=()=>{S.cur=null;save();window.scrollTo({top:0});viewHome();};}

/* Start */
if(!S.name)viewStart();else if(S.cur)route();else viewHome();

</script>
</body>
